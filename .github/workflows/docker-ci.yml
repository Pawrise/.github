# Reusable workflow — Docker : lint (hadolint), build, scan (Trivy), push GHCR.
#
# - Sur pull_request : hadolint + build + scan Trivy (PAS de push).
# - Sur push vers main : + build multi-arch + push GHCR.
#
# Le repo appelant DOIT accorder les permissions :
#   permissions:
#     contents: read
#     packages: write
#
# Usage :
#   jobs:
#     docker:
#       uses: Pawrise/.github/.github/workflows/docker-ci.yml@main
#       permissions:
#         contents: read
#         packages: write
#       with:
#         image-name: data            # -> ghcr.io/pawrise/data
#         context: "."                # optionnel
#         dockerfile: "Dockerfile"    # optionnel
#         platforms: "linux/amd64,linux/arm64"  # optionnel
name: docker-ci

on:
  workflow_call:
    inputs:
      image-name:
        description: "Nom de l'image (-> ghcr.io/<owner>/<image-name>)"
        type: string
        required: true
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: "Dockerfile"
      platforms:
        type: string
        default: "linux/amd64,linux/arm64"

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 1. Lint du Dockerfile
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ inputs.context }}/${{ inputs.dockerfile }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Build single-arch chargé en local pour le scan
      - name: Build (cible de scan)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          load: true
          tags: scan-target:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Scan Trivy — bloque sur HIGH/CRITICAL CORRIGEABLES
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-target:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # 4. Push GHCR (multi-arch) — uniquement sur push vers main
      - name: Login GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (multi-arch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

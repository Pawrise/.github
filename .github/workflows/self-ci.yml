# Self-CI du repo .github : valide les fichiers de workflow eux-mêmes.
# Le repo qui centralise les workflows vérifie sa propre syntaxe (actionlint + shellcheck).
name: self-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            rhysd/actionlint:latest -color

# Reusable workflow — scan de secrets (gitleaks)
# Appelable depuis n'importe quel repo Pawrise. Langage-agnostique.
# Usage (dans le repo appelant) :
#   jobs:
#     secret-scan:
#       uses: Pawrise/.github/.github/workflows/secret-scan.yml@main
name: secret-scan

on:
  workflow_call: {}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet pour scanner tous les commits de la PR
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source=/repo --redact --verbose
